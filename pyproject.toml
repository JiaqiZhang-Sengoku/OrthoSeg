[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthoseg-reference"
version = "0.1.0"
description = "Reference implementation of OrthoSeg for domain-generalizable medical image segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["orthoseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
